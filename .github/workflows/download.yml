name: Download Media

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Media URL"
        required: true
      quality:
        description: "Quality"
        required: true
      chat_id:
        description: "Telegram Chat ID"
        required: true
      bot_token:
        description: "Bot Token"
        required: true
      log_channel:
        description: "Log Channel ID"
        required: false
      message_id:
        description: "Telegram Message ID to edit/delete"
        required: false

jobs:
  download_and_send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python3 -m pip install --upgrade pip
          pip install --upgrade yt-dlp gallery-dl

      - name: Download Content
        id: dl
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          mkdir -p /tmp/dl
          cd /tmp/dl

          case "$QUALITY" in
            "audio")
              yt-dlp -x --audio-format mp3 --audio-quality 0 --no-playlist -o "%(title).50s.%(ext)s" "$URL" || true
              ;;
            "720")
              yt-dlp -f "bestvideo[height<=720]+bestaudio/best[height<=720]" --merge-output-format mp4 --no-playlist -o "%(title).50s.%(ext)s" "$URL" || yt-dlp --no-playlist -o "%(title).50s.%(ext)s" "$URL" || true
              ;;
            "480")
              yt-dlp -f "bestvideo[height<=480]+bestaudio/best[height<=480]" --merge-output-format mp4 --no-playlist -o "%(title).50s.%(ext)s" "$URL" || yt-dlp --no-playlist -o "%(title).50s.%(ext)s" "$URL" || true
              ;;
            "360")
              yt-dlp -f "bestvideo[height<=360]+bestaudio/best[height<=360]" --merge-output-format mp4 --no-playlist -o "%(title).50s.%(ext)s" "$URL" || yt-dlp --no-playlist -o "%(title).50s.%(ext)s" "$URL" || true
              ;;
            *)
              yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 --no-playlist -o "%(title).50s.%(ext)s" "$URL" || yt-dlp --no-playlist -o "%(title).50s.%(ext)s" "$URL" || true
              ;;
          esac

          FILE=$(ls -S /tmp/dl/ | head -n 1)
          if [ -n "$FILE" ] && [ -f "/tmp/dl/$FILE" ]; then
            echo "file_path=/tmp/dl/$FILE" >> $GITHUB_OUTPUT
            echo "file_name=$FILE" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Send File To User
        run: |
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          LOG_CHANNEL="${{ github.event.inputs.log_channel }}"
          MSG_ID="${{ github.event.inputs.message_id }}"
          STATUS="${{ steps.dl.outputs.status }}"

          if [ "$STATUS" = "success" ]; then
            FILE_PATH="${{ steps.dl.outputs.file_path }}"
            FILE_NAME="${{ steps.dl.outputs.file_name }}"
            FILE_SIZE=$(stat -c%s "$FILE_PATH")

            if [ $FILE_SIZE -gt 52428800 ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "text=⚠️ حجم فایل بیش از ۵۰ مگابایت است و تلگرام اجازه آپلود مستقیم نمی‌دهد."
              exit 0
            fi

            # Delete the "downloading..." status message
            if [ -n "$MSG_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage" \
                -d "chat_id=${CHAT_ID}" \
                -d "message_id=${MSG_ID}" || true
            fi

            EXT="${FILE_NAME##*.}"
            EXT_LOWER=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            CAPTION="✅ <b>دانلود با موفقیت انجام شد</b>\n📁 <code>${FILE_NAME}</code>"

            case "$EXT_LOWER" in
              mp3|m4a|ogg|flac|wav|aac)
                METHOD="sendAudio"
                FIELD="audio"
                ;;
              mp4|mkv|webm|mov|avi)
                METHOD="sendVideo"
                FIELD="video"
                ;;
              *)
                METHOD="sendDocument"
                FIELD="document"
                ;;
            esac

            # Send to user
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${METHOD}" \
              -F "chat_id=${CHAT_ID}" \
              -F "${FIELD}=@${FILE_PATH}" \
              -F "caption=${CAPTION}" \
              -F "parse_mode=HTML"

            # Send copy to log channel
            if [ -n "$LOG_CHANNEL" ]; then
              LOG_CAPTION="📋 <b>لاگ دانلود جدید</b>\n👤 کاربر: <code>${CHAT_ID}</code>\n📁 <code>${FILE_NAME}</code>\n🔗 ${{ github.event.inputs.url }}"
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${METHOD}" \
                -F "chat_id=${LOG_CHANNEL}" \
                -F "${FIELD}=@${FILE_PATH}" \
                -F "caption=${LOG_CAPTION}" \
                -F "parse_mode=HTML"
            fi

          else
            if [ -n "$MSG_ID" ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
                -d "chat_id=${CHAT_ID}" \
                -d "message_id=${MSG_ID}" \
                -d "text=❌ دانلود فایل با خطا مواجه شد. لطفاً از صحت لینک مطمئن شوید."
            fi
          fi
