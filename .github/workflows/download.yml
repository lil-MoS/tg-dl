name: Download Media

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Media URL to download"
        required: true
      quality:
        description: "Quality setting"
        required: true
        default: "best"
      chat_id:
        description: "Telegram chat ID"
        required: true
      bot_token:
        description: "Bot token"
        required: true
      log_channel:
        description: "Log channel ID"
        required: false
        default: ""
      request_id:
        description: "Unique request ID"
        required: true
      webhook_url:
        description: "Webhook URL for callback"
        required: true

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q yt-dlp gallery-dl instaloader

      - name: Download Media
        id: dl
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          mkdir -p /tmp/downloads

          # Detect platform and download
          if echo "$URL" | grep -qiE "youtube\.com|youtu\.be"; then
            PLATFORM="youtube"
          elif echo "$URL" | grep -qiE "instagram\.com|instagr\.am"; then
            PLATFORM="instagram"
          elif echo "$URL" | grep -qiE "tiktok\.com|vm\.tiktok"; then
            PLATFORM="tiktok"
          elif echo "$URL" | grep -qiE "twitter\.com|x\.com"; then
            PLATFORM="twitter"
          elif echo "$URL" | grep -qiE "soundcloud\.com"; then
            PLATFORM="soundcloud"
          elif echo "$URL" | grep -qiE "facebook\.com|fb\.watch"; then
            PLATFORM="facebook"
          elif echo "$URL" | grep -qiE "pinterest\.com|pin\.it"; then
            PLATFORM="pinterest"
          elif echo "$URL" | grep -qiE "reddit\.com"; then
            PLATFORM="reddit"
          elif echo "$URL" | grep -qiE "twitch\.tv"; then
            PLATFORM="twitch"
          elif echo "$URL" | grep -qiE "spotify\.com"; then
            PLATFORM="spotify"
          else
            PLATFORM="other"
          fi

          echo "Platform: $PLATFORM"
          echo "platform=$PLATFORM" >> $GITHUB_OUTPUT

          # Set quality options
          case "$QUALITY" in
            "audio")
              OPTS="-x --audio-format mp3 --audio-quality 0"
              ;;
            "720")
              OPTS="-f bestvideo[height<=720]+bestaudio/best[height<=720] --merge-output-format mp4"
              ;;
            "480")
              OPTS="-f bestvideo[height<=480]+bestaudio/best[height<=480] --merge-output-format mp4"
              ;;
            "360")
              OPTS="-f bestvideo[height<=360]+bestaudio/best[height<=360] --merge-output-format mp4"
              ;;
            *)
              OPTS="-f bestvideo+bestaudio/best --merge-output-format mp4"
              ;;
          esac

          cd /tmp/downloads

          # Try yt-dlp first
          yt-dlp $OPTS --no-playlist --max-filesize 50M -o "%(title).50s.%(ext)s" "$URL" 2>/tmp/dl_error.log && {
            echo "status=success" >> $GITHUB_OUTPUT
          } || {
            # Fallback: try without format selection
            yt-dlp --no-playlist --max-filesize 50M -o "%(title).50s.%(ext)s" "$URL" 2>>/tmp/dl_error.log && {
              echo "status=success" >> $GITHUB_OUTPUT
            } || {
              echo "status=failed" >> $GITHUB_OUTPUT
              echo "error=$(cat /tmp/dl_error.log | tail -1)" >> $GITHUB_OUTPUT
            }
          }

          # Get filename
          FILE=$(ls -t /tmp/downloads/ | head -1)
          if [ -n "$FILE" ]; then
            echo "filename=$FILE" >> $GITHUB_OUTPUT
            FILESIZE=$(stat -c%s "/tmp/downloads/$FILE" 2>/dev/null || echo "0")
            echo "filesize=$FILESIZE" >> $GITHUB_OUTPUT
          fi

      - name: Send to Telegram
        if: steps.dl.outputs.status == 'success'
        run: |
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          LOG_CHANNEL="${{ github.event.inputs.log_channel }}"
          FILE="/tmp/downloads/${{ steps.dl.outputs.filename }}"
          PLATFORM="${{ steps.dl.outputs.platform }}"

          if [ ! -f "$FILE" ]; then
            echo "File not found!"
            exit 1
          fi

          FILESIZE=$(stat -c%s "$FILE")
          CAPTION="✅ <b>Download Complete</b>\n📁 $(basename "$FILE")\n📊 $(numfmt --to=iec $FILESIZE)\n🌐 $PLATFORM"

          # Determine file type and send
          EXT="${FILE##*.}"
          case "$EXT" in
            mp3|m4a|ogg|wav|flac|aac|opus|wma)
              METHOD="sendAudio"
              FIELD="audio"
              ;;
            mp4|mkv|webm|avi|mov|flv)
              METHOD="sendVideo"
              FIELD="video"
              ;;
            *)
              METHOD="sendDocument"
              FIELD="document"
              ;;
          esac

          # Send to user
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${METHOD}" \
            -F "${FIELD}=@${FILE}" \
            -F "chat_id=${CHAT_ID}" \
            -F "caption=${CAPTION}" \
            -F "parse_mode=HTML" \
            -F "supports_streaming=true" > /tmp/tg_response.json

          echo "User send response:"
          cat /tmp/tg_response.json

          # Send to log channel
          if [ -n "$LOG_CHANNEL" ]; then
            LOG_CAPTION="📋 <b>Download Log</b>\n👤 User: ${CHAT_ID}\n📁 $(basename "$FILE")\n📊 $(numfmt --to=iec $FILESIZE)\n🌐 $PLATFORM\n🔗 ${{ github.event.inputs.url }}"
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${METHOD}" \
              -F "${FIELD}=@${FILE}" \
              -F "chat_id=${LOG_CHANNEL}" \
              -F "caption=${LOG_CAPTION}" \
              -F "parse_mode=HTML" \
              -F "supports_streaming=true"
          fi

      - name: Notify Status
        if: always()
        run: |
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          WEBHOOK="${{ github.event.inputs.webhook_url }}"
          REQUEST_ID="${{ github.event.inputs.request_id }}"
          STATUS="${{ steps.dl.outputs.status }}"

          if [ "$STATUS" != "success" ]; then
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
              -d "chat_id=${CHAT_ID}" \
              -d "text=❌ Download failed. Please check the URL and try again." \
              -d "parse_mode=HTML"
          fi

          # Callback to webhook
          if [ -n "$WEBHOOK" ]; then
            curl -s "${WEBHOOK}?action=dl_complete&request_id=${REQUEST_ID}&status=${STATUS}&chat_id=${CHAT_ID}" || true
          fi
