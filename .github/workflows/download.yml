name: Telegram Downloader Core

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Media URL"
        required: true
      quality:
        description: "Quality"
        required: true
      chat_id:
        description: "Telegram Chat ID"
        required: true
      bot_token:
        description: "Bot Token"
        required: true
      log_channel:
        description: "Log Channel ID"
        required: false
      message_id:
        description: "Telegram Message ID"
        required: false

jobs:
  process_media:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl nodejs npm
          python3 -m pip install -U pip
          python3 -m pip install -U --pre yt-dlp gallery-dl
          # نصب POT Provider برای دور زدن تشخیص ربات یوتیوب
          npm install -g bgutil-ytdlp-pot-provider || true
          python3 -m pip install -U bgutil-ytdlp-pot-provider || true

      - name: Download Content
        id: dl
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          mkdir -p /tmp/dl
          cd /tmp/dl

          echo "🚀 Processing URL: $URL"
          # استفاده از کلاینت TV و فعال‌سازی POT Provider برای دور زدن بلاک یوتیوب
          YTDLP_ARGS="--force-ipv4 --geo-bypass --no-playlist -o %(title).50s.%(ext)s"
          YTDLP_ARGS="$YTDLP_ARGS --extractor-args youtube:player_client=tv,web"
          YTDLP_ARGS="$YTDLP_ARGS --extractor-args youtubetab:skip=authcheck"

          if echo "$URL" | grep -qiE "instagram\.com|instagr\.am"; then
            echo "📸 Using gallery-dl for Instagram..."
            gallery-dl -D /tmp/dl "$URL" || yt-dlp $YTDLP_ARGS "$URL"
          elif echo "$URL" | grep -qiE "soundcloud\.com"; then
            echo "🎵 Using yt-dlp for SoundCloud..."
            yt-dlp -x --audio-format mp3 --audio-quality 0 $YTDLP_ARGS "$URL" || true
          else
            echo "🎥 Using yt-dlp..."
            case "$QUALITY" in
              "audio") yt-dlp -x --audio-format mp3 --audio-quality 0 $YTDLP_ARGS "$URL" || true ;;
              "720")   yt-dlp -f "bestvideo[height<=720]+bestaudio/best[height<=720]" --merge-output-format mp4 $YTDLP_ARGS "$URL" || yt-dlp $YTDLP_ARGS "$URL" || true ;;
              "480")   yt-dlp -f "bestvideo[height<=480]+bestaudio/best[height<=480]" --merge-output-format mp4 $YTDLP_ARGS "$URL" || yt-dlp $YTDLP_ARGS "$URL" || true ;;
              "360")   yt-dlp -f "bestvideo[height<=360]+bestaudio/best[height<=360]" --merge-output-format mp4 $YTDLP_ARGS "$URL" || yt-dlp $YTDLP_ARGS "$URL" || true ;;
              *)       yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 $YTDLP_ARGS "$URL" || yt-dlp $YTDLP_ARGS "$URL" || true ;;
            esac
          fi

          echo "🔍 Scanning for final file..."
          FILE_PATH=$(find /tmp/dl -type f ! -name "*.part" ! -name "*.ytdl" -exec stat -c "%s %n" {} + | sort -n -r | head -n1 | cut -d" " -f2-)

          if [ -n "$FILE_PATH" ] && [ -f "$FILE_PATH" ]; then
            FILE_NAME=$(basename "$FILE_PATH")
            echo "✅ File saved: $FILE_NAME"
            echo "file_path=$FILE_PATH" >> $GITHUB_OUTPUT
            echo "file_name=$FILE_NAME" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Download failed."
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Telegram Upload
        run: |
          BOT_TOKEN="${{ github.event.inputs.bot_token }}"
          CHAT_ID="${{ github.event.inputs.chat_id }}"
          LOG_CHANNEL="${{ github.event.inputs.log_channel }}"
          MSG_ID="${{ github.event.inputs.message_id }}"
          STATUS="${{ steps.dl.outputs.status }}"

          if [ "$STATUS" = "success" ]; then
            FILE_PATH="${{ steps.dl.outputs.file_path }}"
            FILE_NAME="${{ steps.dl.outputs.file_name }}"
            FILE_SIZE=$(stat -c%s "$FILE_PATH")

            if [ $FILE_SIZE -gt 2097152000 ]; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
                -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}" \
                -d "text=⚠️ File size exceeds 2GB limit."
              exit 0
            fi

            EXT="${FILE_NAME##*.}"
            EXT_LOWER=$(echo "$EXT" | tr '[:upper:]' '[:lower:]')
            CAPTION="✅ <b>Download completed successfully</b>\n📁 <code>${FILE_NAME}</code>\n\n🤖 @YoutubeDLLBot"

            case "$EXT_LOWER" in
              mp3|m4a|ogg|flac|wav|aac) METHOD="sendAudio";  FIELD="audio" ;;
              mp4|mkv|webm|mov|avi)     METHOD="sendVideo";  FIELD="video" ;;
              *)                        METHOD="sendDocument"; FIELD="document" ;;
            esac

            RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${METHOD}" \
              -F "chat_id=${CHAT_ID}" -F "${FIELD}=@${FILE_PATH}" \
              -F "caption=${CAPTION}" -F "parse_mode=HTML")

            BODY=$(echo "$RESPONSE" | sed '$d')

            if echo "$BODY" | grep -q '"ok":true'; then
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/deleteMessage" -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}"
              if [ -n "$LOG_CHANNEL" ]; then
                LOG_CAP="📋 <b>Download Log</b>\n👤 ID: <code>${CHAT_ID}</code>\n🔗 Link: ${{ github.event.inputs.url }}"
                curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/${METHOD}" \
                  -F "chat_id=${LOG_CHANNEL}" -F "${FIELD}=@${FILE_PATH}" \
                  -F "caption=${LOG_CAP}" -F "parse_mode=HTML"
              fi
            else
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
                -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}" \
                -d "text=❌ Error uploading to Telegram."
            fi
          else
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
              -d "chat_id=${CHAT_ID}" -d "message_id=${MSG_ID}" \
              -d "text=❌ Download failed. The link may be private or invalid."
          fi
