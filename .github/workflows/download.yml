name: TG Downloader
on:
  workflow_dispatch:
    inputs:
      url: { required: true }
      quality: { required: true }
      chat_id: { required: true }
      bot_token: { required: true }
      log_channel: { required: false }
      message_id: { required: false }
      mode: { required: false, default: "auto" }
      max_part_mb: { required: false, default: "0" }

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Security Check
        id: sec
        run: |
          URL="${{ github.event.inputs.url }}"
          if ! echo "$URL" | grep -qiE "^https?://"; then
            echo "safe=false" >> $GITHUB_OUTPUT; exit 0
          fi
          HOST=$(echo "$URL" | sed -E "s#^https?://##; s#^[^/]*@##; s#[/:?].*##" | tr "[:upper:]" "[:lower:]")
          if echo "$HOST" | grep -qE "^(localhost|0\.0\.0\.0|127\.|10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.|169\.254\.)"; then
            echo "safe=false" >> $GITHUB_OUTPUT; exit 0
          fi
          echo "safe=true" >> $GITHUB_OUTPUT

      - name: Setup
        if: steps.sec.outputs.safe == 'true'
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq ffmpeg curl python3-pip file wget || true
          python3 -m pip install -U pip || true
          python3 -m pip install -U yt-dlp gallery-dl || true

      - name: Download
        id: dl
        if: steps.sec.outputs.safe == 'true'
        run: |
          URL="${{ github.event.inputs.url }}"
          QUALITY="${{ github.event.inputs.quality }}"
          MODE="${{ github.event.inputs.mode }}"
          mkdir -p /tmp/dl && cd /tmp/dl
          YT="--force-ipv4 --no-playlist --no-warnings --geo-bypass --extractor-args youtube:player_client=tv,web_safari,ios -o %(title).50s.%(ext)s"
          if [ "$MODE" = "auto" ]; then
            if echo "$URL" | grep -qiE "youtube\.com|youtu\.be"; then MODE="youtube"
            elif echo "$URL" | grep -qiE "spotify\.com"; then MODE="spotify"
            elif echo "$URL" | grep -qiE "instagram\.com"; then MODE="instagram"
            elif echo "$URL" | grep -qiE "soundcloud\.com"; then MODE="soundcloud"
            else MODE="direct"; fi
          fi
          case "$MODE" in
            youtube)
              if [ "$QUALITY" = "audio" ]; then
                yt-dlp -x --audio-format mp3 $YT "$URL" || yt-dlp $YT "$URL" || true
              else
                yt-dlp -f "bestvideo+bestaudio/best" --merge-output-format mp4 $YT "$URL" || yt-dlp $YT "$URL" || true
              fi ;;
            instagram) gallery-dl -D /tmp/dl "$URL" || yt-dlp $YT "$URL" || true ;;
            soundcloud) yt-dlp -x --audio-format mp3 $YT "$URL" || true ;;
            spotify) yt-dlp $YT "$URL" || true ;;
            direct)
              F=$(basename "$(echo "$URL" | sed 's/[?#].*//')" | tr -cd 'A-Za-z0-9._-')
              [ -z "$F" ] && F="dl_$(date +%s)"
              curl -L -A "Mozilla/5.0" --max-time 900 -o "$F" "$URL" || true ;;
            *) yt-dlp $YT "$URL" || true ;;
          esac
          FILE=$(find /tmp/dl -type f ! -name "*.part" -exec stat -c "%s %n" {} + | sort -n -r | head -n1 | cut -d" " -f2-)
          if [ -n "$FILE" ] && [ -f "$FILE" ] && [ $(stat -c%s "$FILE") -gt 100 ]; then
            MIME=$(file --mime-type -b "$FILE")
            echo "file_path=$FILE" >> $GITHUB_OUTPUT
            echo "file_name=$(basename "$FILE")" >> $GITHUB_OUTPUT
            echo "file_mime=$MIME" >> $GITHUB_OUTPUT
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failed" >> $GITHUB_OUTPUT
          fi

      - name: Upload
        if: steps.sec.outputs.safe == 'true'
        run: |
          BOT="${{ github.event.inputs.bot_token }}"
          CHAT="${{ github.event.inputs.chat_id }}"
          MSG="${{ github.event.inputs.message_id }}"
          LOG="${{ github.event.inputs.log_channel }}"
          STATUS="${{ steps.dl.outputs.status }}"
          if [ "$STATUS" = "success" ]; then
            F="${{ steps.dl.outputs.file_path }}"
            MIME="${{ steps.dl.outputs.file_mime }}"
            case "$MIME" in
              video/*) M=sendVideo; K=video ;;
              audio/*) M=sendAudio; K=audio ;;
              image/*) M=sendPhoto; K=photo ;;
              *) M=sendDocument; K=document ;;
            esac
            R=$(curl -s -X POST "https://api.telegram.org/bot${BOT}/${M}" -F "chat_id=${CHAT}" -F "${K}=@${F}" -F "caption=@YoutubeDLLBot")
            if echo "$R" | grep -q '"ok":true'; then
              curl -s -X POST "https://api.telegram.org/bot${BOT}/deleteMessage" -d "chat_id=${CHAT}" -d "message_id=${MSG}"
              [ -n "$LOG" ] && curl -s -X POST "https://api.telegram.org/bot${BOT}/${M}" -F "chat_id=${LOG}" -F "${K}=@${F}" -F "caption=Log"
            else
              curl -s -X POST "https://api.telegram.org/bot${BOT}/sendDocument" -F "chat_id=${CHAT}" -F "document=@${F}" -F "caption=@YoutubeDLLBot"
              curl -s -X POST "https://api.telegram.org/bot${BOT}/deleteMessage" -d "chat_id=${CHAT}" -d "message_id=${MSG}"
            fi
          else
            curl -s -X POST "https://api.telegram.org/bot${BOT}/editMessageText" -d "chat_id=${CHAT}" -d "message_id=${MSG}" -d "text=Download failed."
          fi